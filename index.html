"USD"?Math.round(Number(i.monto)*(n||0)):Number(i.monto),moneda:i.moneda,montoOrig:i.moneda==="USD"&&i.monto!==""?Number(i.monto):null,tcCaptura:i.moneda==="USD"&&n||null,margen:i.margen===""?null:Number(i.margen)}),className:"flex-1 py-3 rounded-xl font-semibold",style:{background:i.cliente.trim()?d.tinta:d.borde,color:"#fff"},children:s?"Crear oportunidad":"Guardar cambios"}),!s&&(0,l.jsx)("button",{onClick:a,className:"px-4 rounded-xl border",style:{borderColor:d.borde,color:d.rojo},children:(0,l.jsx)(Yr,{size:18})})]})]})]})})}var fk=[{id:"inicio",t:"Primeros pasos",c:["Cada vez que abres la app, la pantalla de inicio te recibe con la fecha completa, tus pendientes del d\xEDa \u2014vencidos en rojo\u2014 como notificaciones, un panel con el total cotizado, y el tipo de cambio USD\u2192MXN (ed\xEDtalo a mano o toca Actualizar para traerlo autom\xE1tico con internet). Toca cualquiera para entrar directo, o usa Entrar al tablero.","El Centro de Control vive instalado en tu tel\xE9fono o PC y guarda todo localmente: funciona sin internet y nada viaja a servidores.","Instalaci\xF3n: abre la direcci\xF3n de la app en Chrome o Samsung Internet \u2192 men\xFA \u22EE \u2192 Instalar aplicaci\xF3n.","Actualizaciones: sube el nuevo index.html a tu repositorio de GitHub con el mismo nombre, cierra la app y \xE1brela con internet. Tus datos no se tocan.","Respaldo: en Cierre \u2192 Respaldo de datos, exporta un .json de vez en cuando (y siempre antes de actualizar)."]},{id:"regleta",t:"Barra superior (regleta de estado)",c:["Los tres indicadores son lecturas en vivo, como un panel HMI: tiempo registrado hoy (rojo parpadeando si el cron\xF3metro corre), pendientes de hoy + vencidos, y el total cotizado del pipeline (lo que tienes en la calle esperando respuesta). T\xF3calos para saltar a su pesta\xF1a.","El punto cambia de color seg\xFAn el estado: verde = en orden, \xE1mbar = requiere atenci\xF3n, rojo = hay vencidos.","Nube (\u2601\uFE0F) = Cuenta y sincronizaci\xF3n. Ubicaci\xF3n (\u{1F4CD}) = Visitas y check-in. Micr\xF3fono = Asistente por voz. Signo de interrogaci\xF3n = este manual.","Toca el nombre Centro de Control para volver a la pantalla de inicio con tu resumen del d\xEDa en cualquier momento."]},{id:"hoy",t:"Hoy \u2014 pendientes",c:["Captura r\xE1pida: escribe el pendiente, elige Hoy / Ma\xF1ana / Otra fecha, opcionalmente una hora, y toca +.","Toca un pendiente para abrirlo: cliente, fecha, hora de inicio y fin, fecha de finalizaci\xF3n, prioridad y ligarlo a una oportunidad del pipeline.","Dentro del pendiente: Agendar lo manda pre-llenado a Google Calendar; el bot\xF3n de compartir lo env\xEDa individual a Google Tasks o Keep.","Comentarios: dentro de cada pendiente puedes anotar acuerdos o qu\xE9 resolviste; los pendientes con comentario muestran un \xEDcono de globo.","Los pendientes de hoy se ordenan por prioridad: primero los de prioridad alta y, dentro de cada nivel, por hora.","\u2192 ma\xF1ana lo reprograma con un toque. Las secciones Vencidas (rojo) y Acciones de pipeline (\xE1mbar) aparecen solo cuando existen.","Cerrar el d\xEDa: resumen de lo completado, tiempo registrado, opci\xF3n de mover todo lo incompleto a ma\xF1ana y alerta de oportunidades sin pr\xF3xima acci\xF3n. \xDAsalo cada tarde: nada se queda en la cabeza."]},{id:"tiempo",t:"Tiempo",c:["Cron\xF3metro: elige categor\xEDa (visitas, cotizaciones, llamadas, traslados, administrativo, capacitaci\xF3n), cliente opcional, Iniciar. Sigue corriendo aunque cierres la app; Detener y guardar registra los minutos.","+ Registro manual: para capturar tiempo pasado con fecha, minutos y categor\xEDa.","Las barras muestran tu d\xEDa por categor\xEDa y tu semana por d\xEDa (la barra \xE1mbar es hoy). En Registros recientes ves los \xFAltimos movimientos de cualquier d\xEDa y puedes eliminar cualquiera con la X, incluidos los de d\xEDas anteriores."]},{id:"pipeline",t:"Pipeline",c:["Flujo: Acuerdo de visita \u2192 Cotizado \u2192 Por cerrar \u2192 OC recibida \u2192 Pedido realizado \u2192 Facturado (o Perdido). Recibir la OC ya significa que la venta se gan\xF3.","Regla de oro: toda oportunidad activa debe tener pr\xF3xima acci\xF3n con fecha. La app te lo recuerda con la franja \xE1mbar y en el cierre del d\xEDa.","Activas son las que a\xFAn persigues: Acuerdo de visita, Cotizado y Por cerrar. Al recibir la OC dejan de ser activas porque ya se ganaron.","Tarjeta: toca para editar (cliente, monto, margen, marca, plaza, vendedor y los n\xFAmeros de referencia); Avanzar la pasa a la siguiente etapa; Agendar manda la pr\xF3xima acci\xF3n a Google Calendar.","Duplicar oportunidad: dentro de una oportunidad ya guardada, el bot\xF3n Duplicar crea una copia con los mismos datos (con \xAB(copia)\xBB en el t\xEDtulo) y abre el editor en ella para que cambies solo lo que sea distinto. Los cambios sin guardar no se copian: guarda antes de duplicar.","El resumen muestra tres cifras: En juego (visita, cotizado y por cerrar), Pedido (OC y pedido) y Facturado (cobrado). Al elegir un mes en Acumulado por mes ves cuatro cifras de ese mes: Cotizado (por fecha de cotizaci\xF3n, con el n\xFAmero de cotizaciones), Pedido, Facturado y Movimientos.","Desde Cotizado aparecen N\xB0 y fecha de cotizaci\xF3n; desde OC recibida, la OC del cliente con su fecha; desde Pedido, N\xB0 y fecha de pedido y de factura. Todo se muestra como etiquetas y sale en el CSV de Monday.","Margen: captura el porcentaje con que vendiste; se muestra en la tarjeta y alimenta el c\xE1lculo de comisiones.","Moneda: en cada oportunidad puedes capturar el monto en pesos o en d\xF3lares con el switch MXN/USD. Si eliges USD, se convierte y se guarda en pesos usando el tipo de cambio de la pantalla de inicio; la tarjeta muestra el monto original en d\xF3lares.","Comisiones: el bot\xF3n Calcular comisiones toma una oportunidad ya facturada, su monto y margen, y con tu porcentaje calcula utilidad y tu pago.","Pedir estatus a vendedores: el bot\xF3n agrupa tus oportunidades en curso por vendedor y arma un mensaje claro y numerado (cliente, monto, etapa, referencias y un rengl\xF3n Estatus para llenar). Elige cu\xE1les incluir y env\xEDalo por WhatsApp, Compartir o Copiar. Tambi\xE9n puedes pedir el estatus de una sola oportunidad desde su ficha.","Importar de Monday: el bot\xF3n \xABImportar de Monday (Excel)\xBB lee el .xlsx que descargas de tu tablero y crea oportunidades tomando cliente, t\xEDtulo, monto (pesos o d\xF3lares), vendedor, cotizaci\xF3n, OC, sucursal y notas. Compara con lo que ya tienes (por folio de Monday o n\xFAmero de cotizaci\xF3n) y omite las repetidas; revisas la lista y marcas cu\xE1les importar antes de confirmar.","Importar pipeline (Excel): en Cierre, el bot\xF3n \xABImportar pipeline (Excel)\xBB hace lo inverso a exportar: lee el .xlsx que esta app genera en \xABPipeline en Excel\xBB y reconstruye las oportunidades con todos sus datos (etapa, montos, folios y fechas, comisi\xF3n, vendedor, marca, plaza y notas). Sirve para restaurar o mover tu pipeline; las que ya tienes no se duplican.","Cuando cobres, avanza la oportunidad a Facturado. Las fechas de OC, pedido y factura se sellan solas al avanzar de etapa (y puedes editarlas).","El buscador encuentra por cliente, vendedor, marca, plaza y por n\xFAmero de cotizaci\xF3n, OC, pedido o factura. Los chips filtran por etapa (Todas al inicio, vista por defecto). Las tarjetas se ordenan por etapa y, dentro de cada etapa, de mayor a menor monto."]},{id:"metas",t:"Metas y proyectos",c:["Tres horizontes: corto (1\u20133 meses), mediano (3\u201312) y largo (1\u20133 a\xF1os). Agrega con el campo inferior y marca cumplidas con el c\xEDrculo.","Toca una meta para ponerle fecha de inicio y fin: en ese momento se vuelve un proyecto y aparece como barra en el Cronograma.","Cronograma (Gantt): cada barra es una meta con fechas; el color indica el plazo, verde = cumplida, y la l\xEDnea roja vertical marca hoy."]},{id:"cuenta",t:"Cuenta y sincronizaci\xF3n en la nube",c:["Abre Cuenta con el icono de nube (\u2601\uFE0F) de la barra superior. Su color te dice el estado: verde = sincronizado, \xE1mbar = sincronizando o sin conexi\xF3n, gris = sin cuenta.","Crea tu cuenta con correo y contrase\xF1a (m\xEDnimo 6 caracteres) y entra. Con la misma cuenta en tu celular y tu PC ver\xE1s los mismos datos.","La primera vez, entra en el dispositivo que ya tiene tus datos: ese los sube a la nube. En los dem\xE1s dispositivos, al entrar, se descargan.","Importante: antes de iniciar sesi\xF3n por primera vez, exporta un respaldo en Cierre. Es tu red de seguridad.","Funciona sin internet: los cambios se guardan en el dispositivo y suben a la nube en cuanto vuelve la conexi\xF3n.","Por ahora cada usuario tiene sus propios datos sincronizados entre sus dispositivos. Compartir cartera entre varios usuarios con roles es una mejora futura."]},{id:"visitas",t:"Visitas y check-in",c:["Abre Visitas con el icono de ubicaci\xF3n (\u{1F4CD}) de la barra superior; un punto \xE1mbar avisa si tienes una visita de hoy sin check-in.","Programa una visita (suelta o ligada a una oportunidad del pipeline, que autocompleta el cliente) con fecha y hora de inicio y de t\xE9rmino, cliente, notas y resultado. El bot\xF3n Agendar en Google Calendar crea el evento con ese horario.","Check-in: al llegar con el cliente, toca \xABEstoy aqu\xED\xBB y la app guarda tu ubicaci\xF3n GPS y la hora exacta. La primera vez el tel\xE9fono pedir\xE1 permiso de ubicaci\xF3n: ac\xE9ptalo.","Cada visita con check-in muestra \xABVer en mapa\xBB (abre Google Maps en el punto) y la precisi\xF3n en metros.","Marca el resultado (Inter\xE9s, Cotizaci\xF3n, Pedido/cierre, Sin inter\xE9s, Reagendar) para dar seguimiento despu\xE9s."]},{id:"asistente",t:"Asistente por voz",c:["\xC1brelo con el micr\xF3fono de la barra superior. Dicta o escribe varias cosas seguidas y toca Interpretar: la app las clasifica en pendientes, oportunidades, metas o registros de tiempo.","Vista previa: toca cualquier elemento para incluirlo o excluirlo antes de Crear.","Motor Local (gratis): entiende patrones como 'Llamar a Preisa ma\xF1ana a las 10', 'Visita con CFE el viernes de 9 a 11', 'Oportunidad con Femsa por 250 mil, cotizado', 'Meta corto plazo: cerrar 3 proyectos', 'Registra 45 minutos de traslados'.","Motor Claude API (opcional): entiende lenguaje totalmente libre usando tu propia clave de console.anthropic.com. La clave se guarda solo en tu dispositivo, nunca viaja en los respaldos, y el costo es de centavos por dictado.","El dictado usa el reconocimiento del navegador: funciona mejor en Chrome."]},{id:"comisiones",t:"Comisiones",c:["La pesta\xF1a Comisiones (icono %) se alimenta sola de las oportunidades en etapa Facturado.","Para cada facturada calcula la utilidad (monto \xD7 margen) y, con el porcentaje de comisi\xF3n que captures, tu comisi\xF3n. El porcentaje es propio de cada oportunidad.","Arriba eliges el mes (por fecha de factura) y ves el resumen: utilidad total, comisi\xF3n total, comisi\xF3n pagada y pendiente de pago.","Marca \xABPagado\xBB cuando te liquiden la comisi\xF3n (normalmente al mes siguiente); el resumen reparte autom\xE1ticamente entre pagado y pendiente.","El bot\xF3n \xABCalcular comisiones\xBB del Pipeline sigue disponible para un c\xE1lculo r\xE1pido sobre cualquier oportunidad facturada."]},{id:"cierre",t:"Cierre \u2014 reportes, exportar y respaldo",c:["Cierre de semana: tus n\xFAmeros de la semana y Copiar resumen para pegarlo en un reporte o mensaje a tu jefe.","Exportar: \xABPipeline en Excel\xBB genera un .xlsx ordenado como el flujo de venta (Oportunidad, Etapa, Cliente, Cotizaci\xF3n y su fecha, Monto en pesos y su equivalente en d\xF3lares, Margen, OC, Pedido, Factura y sus fechas, luego utilidad/comisi\xF3n y datos de contacto), con las columnas de dinero en formato de moneda. La columna Monto (USD) usa el importe original si la oportunidad se captur\xF3 en d\xF3lares, o el equivalente al tipo de cambio actual si fue en pesos. \xABPipeline para Monday\xBB y los dem\xE1s generan CSV para \xABImportar datos \u2192 Excel/CSV\xBB en tu tablero.","Enviar a Google Tasks / Keep: filtra pendientes, completados o todos, y Compartir abre el men\xFA de Android (Tasks crea una tarea con la lista; Keep una nota). Copiar lista sirve para pegar en la PC.","Respaldo de datos: Exportar genera un .json completo; Importar lo restaura en otro dispositivo o tras un cambio de tel\xE9fono.","Mejoras de la app: anota cualquier fricci\xF3n; el bot\xF3n Copiar lista para Claude arma el mensaje exacto para pedir la siguiente versi\xF3n."]},{id:"vers",t:"Novedades por versi\xF3n",c:["v3.7 \u2014 En Cierre ahora puedes importar el propio Excel del pipeline (lo inverso a exportarlo): reconstruye las oportunidades con todos sus datos, ideal para restaurar o mover tu pipeline. No duplica lo que ya tienes.","v3.6 \u2014 Nuevo importador: sube el Excel exportado de Monday y crea las oportunidades autom\xE1ticamente (cliente, t\xEDtulo, monto en pesos o d\xF3lares, vendedor, cotizaci\xF3n, OC, sucursal y notas). Detecta y omite las que ya tienes para no duplicarlas.","v3.5 \u2014 Ahora puedes duplicar una oportunidad desde su ficha: crea una copia con los mismos datos y abre el editor para cambiar solo lo necesario. Ideal para cargar r\xE1pido oportunidades parecidas.","v3.4 \u2014 Al filtrar por mes en el pipeline ahora tambi\xE9n ves lo Cotizado en ese mes (seg\xFAn la fecha de cotizaci\xF3n) y cu\xE1ntas cotizaciones fueron, junto a Pedido, Facturado y Movimientos.","v3.3 \u2014 El Excel del pipeline incluye una columna Monto (USD) junto a la de pesos: muestra el importe original en d\xF3lares si as\xED se captur\xF3, o el equivalente al tipo de cambio actual.","v3.2 \u2014 El Excel del pipeline se reorden\xF3 siguiendo el flujo de venta: Oportunidad, Etapa, Cliente, Cotizaci\xF3n y su fecha, Monto, Margen, OC, Pedido, Factura y sus fechas, y al final utilidad/comisi\xF3n y datos de contacto.","v3.1 \u2014 Nuevo \xABPedir estatus a vendedores\xBB en el Pipeline: agrupa las oportunidades en curso por vendedor y genera un mensaje claro y numerado (con rengl\xF3n Estatus) para enviar por WhatsApp o compartir. Tambi\xE9n disponible por oportunidad desde su ficha.","v3.0 \u2014 Nuevo tema visual en negro y rojo; el tipo de cambio admite hasta 4 decimales para ver el d\xF3lar con m\xE1s detalle; las visitas ya no guardan fotos (para no consumir memoria del dispositivo).","v2.9 \u2014 Las visitas ahora tienen fecha y hora de t\xE9rmino (adem\xE1s de las de inicio) y un bot\xF3n para agendarlas directamente en Google Calendar.","v2.8 \u2014 Cuenta en la nube (icono \u2601\uFE0F): inicia sesi\xF3n con correo y contrase\xF1a y tus datos se sincronizan autom\xE1ticamente entre tu celular y tu PC. Sigue funcionando sin internet y sincroniza al reconectar.","v2.7 \u2014 Nuevo m\xF3dulo de Visitas (icono de ubicaci\xF3n en la barra superior): programa visitas sueltas o ligadas a una oportunidad, haz check-in por GPS al llegar con hora y ubicaci\xF3n, marca el resultado y adjunta foto del lugar.","v2.6 \u2014 Captura de oportunidades en pesos o d\xF3lares con switch MXN/USD (todo se guarda en pesos); tipo de cambio USD\u2192MXN editable en la pantalla de inicio, con actualizaci\xF3n autom\xE1tica por internet.","v2.5 \u2014 El buscador del pipeline tambi\xE9n encuentra por n\xFAmero de cotizaci\xF3n, OC, pedido o factura; nuevo campo Vendedor en la oportunidad (buscable y en las exportaciones).","v2.4 \u2014 Nueva pesta\xF1a Comisiones: se alimenta de las facturadas, con % de comisi\xF3n propio por oportunidad, filtro por mes, totales de utilidad y comisi\xF3n (pagada/pendiente) y marca de \xABPagado\xBB. El Excel incluye columnas de utilidad y comisi\xF3n.","v2.3 \u2014 El pipeline abre en \xABTodas\xBB y se ordena por etapa y monto (mayor primero); se quita el filtro \xABActivas\xBB; la pantalla de inicio muestra el total cotizado y el n\xFAmero de cotizaciones; exportaci\xF3n a Excel (.xlsx) con formato de moneda.","v2.2 \u2014 OC recibida va antes de Pedido realizado, con fecha de OC; la regleta superior monitorea el total cotizado; el manual ahora incluye la ilustraci\xF3n de cada pantalla.","v2.1 \u2014 Fechas de cotizaci\xF3n, pedido y factura (se sellan solas al avanzar); se elimina la etapa Ganado (Pedido ya implica venta ganada); Activas son solo visita, cotizado y por cerrar; flujo de etapas ilustrado en este manual.","v2.0 \u2014 Resumen del pipeline con Pedido y Facturado y acumulado por mes; margen y calculadora de comisiones; N\xB0 de cotizaci\xF3n y OC del cliente; filtro Todas al inicio.","v1.9 \u2014 Comentarios en los pendientes; orden por prioridad en Hoy; los registros de tiempo de d\xEDas anteriores ya se pueden eliminar.","v1.8 \u2014 El nombre Centro de Control en la barra superior regresa a la pantalla de inicio.","v1.7 \u2014 Pantalla de inicio en cada apertura: fecha completa con a\xF1o y resumen de pendientes del d\xEDa estilo notificaciones.","v1.6 \u2014 Pantalla de inicio y este manual con \xEDndice (bot\xF3n ?); N\xB0 de pedido y factura con etapa Facturado; metas con fechas y cronograma Gantt.","v1.5 \u2014 Env\xEDo de pendientes a Google Tasks y Keep: lista con filtro y bot\xF3n individual por pendiente.","v1.4 \u2014 Agendar en Google Calendar; horas de inicio y fin en pendientes; Asistente por voz con int\xE9rprete Local y Claude API.","v1.3 \u2014 Correcci\xF3n de estilos en la versi\xF3n publicada (Tailwind incluido en el archivo).","v1.2 \u2014 Versi\xF3n PWA instalable con guardado local y Respaldo exportar/importar.","v1.1 \u2014 Bit\xE1cora de mejoras con generador de prompt para Claude.","v1.0 \u2014 Tablero inicial: pendientes, tiempo, pipeline, metas, cierre de d\xEDa/semana y export a Monday."]}],k0=Object.fromEntries(Object.entries(m0).map(([e,t])=>[e,"data:image/svg+xml;utf8,"+encodeURIComponent(t)]));function hk({onCerrar:e}){let[t,a]=(0,F.useState)(null);return(0,l.jsx)("div",{className:"fixed inset-0 z-50 flex flex-col
